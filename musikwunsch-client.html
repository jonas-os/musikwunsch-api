<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Musikwunsch abgeben</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f3f6fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    main { width: min(100%, 520px); background: white; border-radius: 22px; padding: clamp(22px, 6vw, 42px); box-shadow: 0 12px 45px #13213c18; }
    h1 { margin: 0 0 8px; font-size: clamp(1.65rem, 7vw, 2.25rem); }
    .intro { margin: 0 0 26px; color: #647089; }
    label { display: block; font-weight: 700; margin: 16px 0 7px; }
    input { width: 100%; border: 1px solid #cdd5e2; border-radius: 12px; padding: 14px 15px; font: inherit; font-size: 16px; }
    input:focus { outline: 3px solid #7c9cff55; border-color: #5679ed; }
    button { width: 100%; border: 0; border-radius: 12px; padding: 15px; margin-top: 24px; font: inherit; font-weight: 800; color: white; background: #315be8; cursor: pointer; }
    button:disabled { background: #9aa5b8; cursor: not-allowed; }
    .status { margin-top: 18px; border-radius: 12px; padding: 13px 14px; line-height: 1.4; }
    .hidden { display: none; }
    .success { background: #e8f8ef; color: #17643b; }
    .error { background: #fff0f0; color: #a12525; }
    .locked { background: #fff5df; color: #81520a; }
    .config-warning { background: #fff0f0; color: #a12525; margin-bottom: 18px; }
  </style>
</head>
<body>
  <main>
    <h1>Musikwunsch</h1>
    <p class="intro">Wünsche dir einen Song für die nächste Runde.</p>
    <div id="configWarning" class="status config-warning hidden">Die Supabase-Konfiguration fehlt noch. Trage URL und Anon-Key im HTML ein.</div>
    <div id="lockedBox" class="status locked hidden">Das Absenden ist momentan gesperrt.</div>
    <form id="requestForm">
      <label for="title">Songtitel *</label>
      <input id="title" name="title" required maxlength="200" autocomplete="off" placeholder="z. B. Billie Jean">
      <label for="artist">Interpret</label>
      <input id="artist" name="artist" maxlength="200" autocomplete="off" placeholder="z. B. Michael Jackson">
      <button id="submitButton" type="submit">Musikwunsch absenden</button>
    </form>
    <div id="message" class="status hidden" role="status" aria-live="polite"></div>
  </main>

<script>
  // Diese beiden Werte in beiden HTML-Dateien identisch eintragen.
  const SUPABASE_URL = 'https://sloapgujswzrpjadalxf.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_Sr8AVRdZtQTiQtCZPqW0_A_g7CcG9eO';
  const configured = !SUPABASE_URL.includes('DEIN-PROJEKT') && !SUPABASE_ANON_KEY.includes('DEIN_SUPABASE');
  const form = document.getElementById('requestForm');
  const button = document.getElementById('submitButton');
  const message = document.getElementById('message');
  const lockedBox = document.getElementById('lockedBox');
  let client, isLocked = false;

  function showMessage(text, type) {
    message.textContent = text;
    message.className = `status ${type || ''}`;
    message.classList.remove('hidden');
  }
  function applyLock(locked) {
    isLocked = !!locked;
    form.querySelectorAll('input, button').forEach(el => el.disabled = isLocked || !configured);
    lockedBox.classList.toggle('hidden', !isLocked);
  }
  async function loadLockState() {
    if (!configured) return;
    const { data, error } = await client.from('app_settings').select('submissions_locked').eq('id', true).single();
    if (!error && data) applyLock(data.submissions_locked);
  }
  if (!configured) {
    document.getElementById('configWarning').classList.remove('hidden');
    applyLock(true);
  } else {
    client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    loadLockState();
    client.channel('submission-lock')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'app_settings' }, payload => applyLock(payload.new.submissions_locked))
      .subscribe();
    // Fallback, falls Realtime im Projekt nicht aktiviert wurde.
    setInterval(loadLockState, 10000);
  }
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (isLocked || !configured) return;
    button.disabled = true;
    message.classList.add('hidden');
    const title = document.getElementById('title').value.trim();
    const artist = document.getElementById('artist').value.trim();
    const { error } = await client.from('music_requests').insert({ title, artist: artist || null });
    if (error) {
      if (error.code === '42501') {
        applyLock(true);
        showMessage('Das Absenden wurde gerade gesperrt.', 'locked');
      } else {
        showMessage('Der Musikwunsch konnte nicht gespeichert werden.', 'error');
      }
      button.disabled = isLocked;
      return;
    }
    form.reset();
    showMessage('Musikwunsch wurde abgesendet.', 'success');
    button.disabled = false;
  });
</script>
</body>
</html>
