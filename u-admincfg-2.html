<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Musikwunsch-Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f3f6fb; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; }
    .shell { width: min(100%, 1100px); margin: auto; }
    .card { background: white; border-radius: 18px; padding: 26px; box-shadow: 0 10px 35px #13213c14; }
    h1 { margin: 0 0 7px; } h2 { margin-top: 0; }
    .muted { color: #68748a; }
    .login { width: min(100%, 430px); margin: 8vh auto; }
    label { display: block; font-weight: 700; margin: 15px 0 6px; }
    input { width: 100%; padding: 12px; border: 1px solid #cdd5e2; border-radius: 10px; font: inherit; }
    button { border: 0; border-radius: 10px; padding: 12px 16px; font: inherit; font-weight: 750; cursor: pointer; }
    .primary { color: white; background: #315be8; } .danger { color: white; background: #c43636; }
    .secondary { background: #e9edf5; color: #26334d; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .hidden { display: none !important; }
    .notice { margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: #fff0f0; color: #a12525; }
    header { display: flex; justify-content: space-between; gap: 20px; align-items: center; flex-wrap: wrap; margin-bottom: 22px; }
    .toolbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 18px 0; }
    .lock { display: flex; align-items: center; gap: 10px; padding: 12px 15px; border-radius: 10px; background: #fff5df; color: #81520a; font-weight: 750; }
    .lock input { width: 20px; height: 20px; accent-color: #c98b18; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; } th, td { text-align: left; padding: 14px 10px; border-bottom: 1px solid #e5e9f1; } th { color: #68748a; font-size: .88rem; }
    .empty { color: #68748a; padding: 24px 0; }
    @media (max-width: 650px) { body { padding: 14px; } .card { padding: 19px; } th:nth-child(3), td:nth-child(3) { display: none; } th:nth-child(4), td:nth-child(4) { white-space: nowrap; } }
  </style>
</head>
<body>
  <div class="shell">
    <section id="loginCard" class="card login">
      <h1>Admin-Login</h1><p class="muted">Melde dich mit einem Supabase-Admin-Konto an.</p>
      <form id="loginForm">
        <label for="email">E-Mail</label><input id="email" type="email" required autocomplete="username">
        <label for="password">Passwort</label><input id="password" type="password" required autocomplete="current-password">
        <button class="primary" type="submit" style="margin-top:20px;width:100%">Anmelden</button>
      </form>
      <div id="loginMessage" class="notice hidden"></div>
    </section>

    <section id="adminPanel" class="hidden">
      <header><div><h1>Musikwunsch-Admin</h1><div id="userLabel" class="muted"></div></div><button id="logoutButton" class="secondary">Abmelden</button></header>
      <div class="card">
        <div class="toolbar">
          <label class="lock"><input id="lockToggle" type="checkbox"> Absenden sperren</label>
          <button id="deleteOldest" class="danger">Ältesten Wunsch löschen</button>
          <button id="refreshButton" class="secondary">Aktualisieren</button>
        </div>
        <div id="panelMessage" class="notice hidden"></div>
        <div class="table-wrap"><table><thead><tr><th>Songtitel</th><th>Interpret</th><th>Abgegeben</th><th>Aktion</th></tr></thead><tbody id="requestRows"></tbody></table></div>
        <div id="empty" class="empty hidden">Noch keine Musikwünsche vorhanden.</div>
      </div>
    </section>
  </div>
<script>
  const SUPABASE_URL = 'https://sloapgujswzrpjadalxf.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_Sr8AVRdZtQTiQtCZPqW0_A_g7CcG9eO';
  const configured = !SUPABASE_URL.includes('DEIN-PROJEKT') && !SUPABASE_ANON_KEY.includes('DEIN_SUPABASE');
  const client = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
  const loginCard = document.getElementById('loginCard'), adminPanel = document.getElementById('adminPanel');
  const loginMessage = document.getElementById('loginMessage'), panelMessage = document.getElementById('panelMessage');
  let requests = [];
  function notice(el, text) { el.textContent = text; el.classList.remove('hidden'); }
  function clearNotice(el) { el.classList.add('hidden'); }
  function formatDate(value) { return new Intl.DateTimeFormat('de-AT', { dateStyle: 'short', timeStyle: 'short' }).format(new Date(value)); }
  function render() {
    const rows = document.getElementById('requestRows'); rows.innerHTML = '';
    document.getElementById('empty').classList.toggle('hidden', requests.length !== 0);
    requests.forEach(r => {
      const tr = document.createElement('tr');
      [r.title, r.artist || '—', formatDate(r.created_at)].forEach(v => { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); });
      const actionCell = document.createElement('td');
      const deleteButton = document.createElement('button');
      deleteButton.className = 'danger';
      deleteButton.type = 'button';
      deleteButton.textContent = 'Löschen';
      deleteButton.addEventListener('click', () => deleteRequest(r.id, r.title));
      actionCell.appendChild(deleteButton);
      tr.appendChild(actionCell);
      rows.appendChild(tr);
    });
    document.getElementById('deleteOldest').disabled = requests.length === 0;
  }
  async function deleteRequest(id, title) {
    if (!confirm(`Diesen Musikwunsch löschen?\n\n${title}`)) return;
    const { error } = await client.from('music_requests').delete().eq('id', id);
    if (error) {
      notice(panelMessage, 'Der Musikwunsch konnte nicht gelöscht werden.');
      return;
    }
    clearNotice(panelMessage);
    await loadRequests();
  }
  async function loadRequests() {
    const { data, error } = await client.from('music_requests').select('id,title,artist,created_at').order('created_at', { ascending: true });
    if (error) { notice(panelMessage, 'Wünsche konnten nicht geladen werden.'); return; }
    requests = data || []; render();
  }
  async function loadSettings() {
    const { data, error } = await client.from('app_settings').select('submissions_locked').eq('id', true).single();
    if (!error && data) document.getElementById('lockToggle').checked = data.submissions_locked;
  }
  async function showAdmin(user) {
    loginCard.classList.add('hidden'); adminPanel.classList.remove('hidden'); document.getElementById('userLabel').textContent = user.email || ''; await Promise.all([loadRequests(), loadSettings()]);
    client.channel('admin-live').on('postgres_changes', { event: '*', schema: 'public', table: 'music_requests' }, loadRequests).on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'app_settings' }, p => document.getElementById('lockToggle').checked = p.new.submissions_locked).subscribe();
  }
  document.getElementById('loginForm').addEventListener('submit', async e => { e.preventDefault(); if (!configured) return notice(loginMessage, 'Supabase-Konfiguration fehlt noch.'); const { data, error } = await client.auth.signInWithPassword({ email: email.value, password: password.value }); if (error) return notice(loginMessage, 'Anmeldung fehlgeschlagen.'); showAdmin(data.user); });
  document.getElementById('logoutButton').onclick = () => client.auth.signOut().then(() => location.reload());
  document.getElementById('refreshButton').onclick = () => Promise.all([loadRequests(), loadSettings()]);
  document.getElementById('lockToggle').onchange = async e => { const { error } = await client.from('app_settings').update({ submissions_locked: e.target.checked }).eq('id', true); if (error) { e.target.checked = !e.target.checked; notice(panelMessage, 'Sperre konnte nicht geändert werden.'); } };
  document.getElementById('deleteOldest').onclick = async () => { const { error } = await client.rpc('delete_oldest_music_request'); if (error) notice(panelMessage, 'Der älteste Wunsch konnte nicht gelöscht werden.'); else await loadRequests(); };
  if (configured) client.auth.getSession().then(({ data }) => { if (data.session) showAdmin(data.session.user); }); else notice(loginMessage, 'Supabase-Konfiguration fehlt noch.');
</script>
</body>
</html>
